<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Button</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="co-container" id="coBtn" role="button" tabindex="0" aria-live="polite">
  <div class="co-left">
    <svg class="co-check" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    <div class="co-card"><div class="co-card-line"></div><div class="co-buttons"></div></div>
    <div class="co-post">
      <div class="co-post-line"></div>
      <div class="co-screen"><div class="co-dollar">$</div></div>
      <div class="co-numbers"></div>
      <div class="co-numbers2"></div>
    </div>
  </div>
  <div class="co-right">
    <span class="co-text">
      <span class="co-new" id="coLabel">Checkout</span>
      <span class="co-sub" id="coSub">Secure payment</span>
    </span>
    <svg class="co-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
